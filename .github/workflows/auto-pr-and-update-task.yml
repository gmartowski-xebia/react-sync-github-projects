name: Auto PR & Update Project Task

on:
  push:
    branches:
      - 'feature/**'

jobs:
  create-pr-and-update-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Create Pull Request & Update Project Task
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ secrets.REPO_OWNER }}
          REPO: ${{ secrets.REPO_NAME }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          ITEM_ID: ${{ secrets.ITEM_ID }}
          STATUS_FIELD_ID: ${{ secrets.STATUS_FIELD_ID }}
          REVIEW_OPTION_ID: ${{ secrets.REVIEW_OPTION_ID }}
          BASE_BRANCH: main
        run: |
          npx tsx src/utils/autoPrAndUpdateTask.ts
